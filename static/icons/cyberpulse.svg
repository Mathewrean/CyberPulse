<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <defs>
    <radialGradient id="spotifyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="50" cy="50" r="46" fill="#121212" stroke="#1DB954" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Spotify Waves with Cyber Shield Aesthetic -->
  <path d="M28 38 C42 32, 60 32, 72 38" stroke="url(#spotifyGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M32 50 C44 45, 58 45, 68 50" stroke="url(#spotifyGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M37 62 C46 58, 56 58, 63 62" stroke="url(#spotifyGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Central Pulse Indicator -->
  <circle cx="50" cy="74" r="3.5" fill="#1DB954"/>
</svg>
